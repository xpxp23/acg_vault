<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACG Vault 穿透解锁条</title>
  <script>
    (function () {
      function syncTheme() {
        try {
          var mode = 'auto';
          var raw = localStorage.getItem('acg_theme');
          if (raw) {
            var o = JSON.parse(raw);
            if (o && o.mode) mode = o.mode;
            if (o && o.accent) document.documentElement.dataset.accent = o.accent;
          }
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = (mode === 'light' || mode === 'dark') ? mode : (dark ? 'dark' : 'light');
        } catch (e) {}
      }
      syncTheme();
      window.addEventListener('storage', syncTheme);
    })();
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070a12;
      font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
    }
    #unlock-btn {
      width: 100%;
      height: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: 1px solid rgba(0, 195, 227, 0.75);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(8, 145, 178, 0.95), rgba(6, 182, 212, 0.92));
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.01em;
      cursor: pointer;
      padding: 0 4px;
      white-space: nowrap;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: background 0.12s ease, border-color 0.12s ease, filter 0.12s ease;
    }
    #unlock-btn:hover {
      background: linear-gradient(135deg, #00c3e3, #0891b2);
      border-color: #ffffff;
      filter: brightness(1.08);
    }
    #unlock-btn:active {
      transform: scale(0.97);
    }

    html[data-theme="light"],
    html[data-theme="light"] body {
      background: #f2f2f2;
    }
    html[data-theme="light"] #unlock-btn {
      background: #00c3e3;
      border-color: #008ba3;
      color: #ffffff;
      box-shadow: 0 1px 4px rgba(0, 195, 227, 0.35);
    }
    html[data-theme="light"] #unlock-btn:hover {
      background: #00a8c6;
      border-color: #005f73;
    }
  </style>
</head>
<body>
  <button id="unlock-btn" title="点击立即解除鼠标穿透锁定（或按 Alt+G / Alt+T）">
    <span>🔓</span>
    <span>点此解锁</span>
  </button>
  <script>
    document.getElementById('unlock-btn').addEventListener('click', async function () {
      try {
        if (window.pywebview && window.pywebview.api && window.pywebview.api.win_unlock) {
          await window.pywebview.api.win_unlock();
          return;
        }
      } catch (e) { /* fallthrough */ }
      try {
        await fetch('/api/overlay/click_through', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enable: false })
        });
      } catch (e) { /* ignore */ }
    });
  </script>
</body>
</html>
