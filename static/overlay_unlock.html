<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>解锁穿透</title>
  <script>
    (function () {
      try {
        var mode = 'auto';
        var raw = localStorage.getItem('acg_theme');
        if (raw) { var o = JSON.parse(raw); if (o && o.mode) mode = o.mode; }
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = (mode === 'light' || mode === 'dark') ? mode : (dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #0b1020;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
    }
    button {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(34, 211, 238, 0.65);
      border-radius: 7px;
      background: rgba(14, 116, 144, 0.92);
      color: #ecfeff;
      font-size: 12px; line-height: 1;
      cursor: pointer;
      padding: 0;
      transition: background 0.12s ease;
    }
    button:hover { background: #0891b2; }
    button:active { transform: translateY(1px); }

    html[data-theme="light"] { background: #f4f4f4; }
    html[data-theme="light"] body { background: #f4f4f4; }
    html[data-theme="light"] button {
      background: #e0f2fe;
      border-color: rgba(8, 145, 178, 0.75);
      color: #0e7490;
    }
    html[data-theme="light"] button:hover { background: #bae6fd; }
  </style>
</head>
<body>
  <button id="unlock-btn" title="解除鼠标穿透（也可以按 Alt+G / Alt+T）">🔓</button>
  <script>
    document.getElementById('unlock-btn').addEventListener('click', async function () {
      try {
        if (window.pywebview && window.pywebview.api && window.pywebview.api.win_unlock) {
          await window.pywebview.api.win_unlock();
          return;
        }
      } catch (e) { /* fallthrough */ }
      try {
        await fetch('/api/overlay/click_through', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enable: false })
        });
      } catch (e) { /* ignore */ }
    });
  </script>
</body>
</html>
